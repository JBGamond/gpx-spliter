[package]
name = "gpx-splitter"
version = "0.1.0"
edition = "2024"
description = "Convert GPX files to CSV with gradient-based chunking for race planning"
license = "MIT"
default-run = "gpx-splitter"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
csv = "1.4.0"
geo = "0.32.0"
gpx = "0.10.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.139"
time = "0.3.47"

# Web server dependencies (not for WASM)
axum = { version = "0.8.1", features = ["multipart"], optional = true }
tokio = { version = "1.43.0", features = ["full"], optional = true }
tower-http = { version = "0.6.2", features = ["fs", "cors"], optional = true }
tracing = { version = "0.1.41", optional = true }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"], optional = true }
futures = { version = "0.3.31", optional = true }

# WASM dependencies
wasm-bindgen = { version = "0.2.100", optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
js-sys = { version = "0.3.77", optional = true }
getrandom = { version = "0.2.17", features = ["js"] }

[features]
default = ["server"]
server = ["axum", "tokio", "tower-http", "tracing", "tracing-subscriber", "futures"]
wasm = ["wasm-bindgen", "serde-wasm-bindgen", "js-sys"]

[[bin]]
name = "web"
path = "src/bin/web.rs"
required-features = ["server"]

[[bin]]
name = "gpx-splitter"
path = "src/main.rs"
# CLI doesn't strictly need the server features but it uses anyhow, clap etc which are always on.
